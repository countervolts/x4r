# x4r settings. Restart the game after changing them.
#
# Profile: which kernel set runs.
#   auto   pick by GPU: RDNA3 and RDNA4 get the WMMA kernels, any other GPU the stock dot4 kernels
#   rdna3  force the gfx11 WMMA set        rdna4  force the gfx12 WMMA set
#   dxil   force the stock dot4 kernels (slowest, works on any RDNA2 or newer GPU)
Profile = auto
# The XeSS version the shipped kernels were translated from (shown in status.txt). A game with another libxess.dll
# makes XeSS fail to build its pipelines: x4r never silently drops to DP4a.
XessVersion = 2.0.2.68
# Capture = true records the kernels the game's XeSS setup asks for (into the prefix, C:\igdext_kernels) instead of failing,
# so missing ones can be translated. Output is wrong while it is on; normally leave it off.
Capture = false
# Backend = dp4a runs XeSS's own DP4a path (no x4r kernels) under the same OptiScaler setup, to compare against.
# Backend = x4r (default) runs the translated XMX kernels.
Backend = x4r
# Trace = true writes per-kernel GPU times (every 120 frames, plus one frame in dispatch order) to C:\igdext_trace.log inside the prefix.
Trace = false
